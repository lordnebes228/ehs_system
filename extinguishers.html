<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Учет огнетушителей - ССК Звезда</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1b; color: #eee; margin: 0; padding: 0; }
        .header-nav { background: #252526; padding: 12px 20px; display: flex; align-items: center; border-bottom: 1px solid #333; }
        .back-btn { background: #3e3e3f; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; }
        .container { max-width: 1000px; margin: 20px auto; background: #252526; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { color: #e65100; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: 600; color: #bbb; font-size: 13px; }
        input, select, textarea { background: #333; border: 1px solid #444; color: white; padding: 10px; border-radius: 4px; }
        input:disabled { background: #2a2a2a; color: #777; cursor: not-allowed; }
        .save-btn { grid-column: span 2; padding: 15px; background: #2e7d32; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .save-btn:hover { background: #388e3c; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; background: #2d2d2d; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #3f3f3f; }
        th { background: #333; color: #e65100; font-size: 12px; text-transform: uppercase; }
        .expired { color: #ff5252; font-weight: bold; }
    </style>
</head>
<body>

<div class="header-nav">
    <a href="index.html" class="back-btn">← Панель управления</a>
</div>

<div class="container">
    <h2>🧯 Регистрация и проверка огнетушителя</h2>

    <div class="form-grid">
        <div class="form-group">
            <label>Подразделение (закреплено):</label>
            <input type="text" id="shop_name" disabled>
        </div>
        
        <div class="form-group">
            <label>Инвентарный номер:</label>
            <input type="text" id="serial_number" placeholder="Например: ССК-001">
        </div>
        
        <div class="form-group">
            <label>Тип огнетушителя:</label>
            <select id="ext_type">
                <option value="ОП (порошковый)">ОП (порошковый)</option>
                <option value="ОУ (углекислотный)">ОУ (углекислотный)</option>
                <option value="ОВ (воздушно-пенный)">ОВ (воздушно-пенный)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Масса заряда (кг):</label>
            <input type="number" id="charge_weight" step="0.1">
        </div>

        <div class="form-group">
            <label>Дата осмотра:</label>
            <input type="date" id="last_check" onchange="calcNextCheck()">
        </div>
        
        <div class="form-group">
            <label>Следующий осмотр (+3 месяца):</label>
            <input type="date" id="next_check">
        </div>

        <div class="form-group">
            <label>Текущее состояние:</label>
            <select id="status">
                <option value="исправен">✅ исправен</option>
                <option value="перезарядка">⚠️ перезарядка</option>
                <option value="списан">❌ списан</option>
            </select>
        </div>

        <div class="form-group">
            <label>Точное место (ориентир):</label>
            <input type="text" id="location" placeholder="Секция А, пост 5">
        </div>

        <div class="form-group" style="grid-column: span 2;">
            <label>Комментарий инспектора:</label>
            <textarea id="notes" rows="2"></textarea>
        </div>

        <button class="save-btn" onclick="saveExtinguisher()">ПОДПИСАТЬ И СОХРАНИТЬ АКТ</button>
    </div>

    <h3>История проверок подразделения</h3>
    <table id="extTable">
        <thead>
            <tr>
                <th>Оборудование</th>
                <th>Место</th>
                <th>Срок проверки</th>
                <th>Статус</th>
                <th>Инспектор (ПЭП)</th> </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const _db = supabase.createClient('https://znlizfcqmxgrnhimzgul.supabase.co', 'sb_publishable_RacKEAEQhObo56gGr8BYnA_numHTBIj');

    // Получаем профиль из памяти
    const rawData = localStorage.getItem('userProfile');
    const userProfile = rawData ? JSON.parse(rawData) : {};
    
    const myDept = (userProfile.department || "").trim();
    const myName = (userProfile.full_name || "Не указан").trim();

    // 1. Блокируем изменение цеха
    document.getElementById('shop_name').value = myDept || "Цех не определен";

    function calcNextCheck() {
        const val = document.getElementById('last_check').value;
        if (!val) return;
        let d = new Date(val);
        d.setMonth(d.setMonth() + 3);
        document.getElementById('next_check').value = d.toISOString().split('T')[0];
    }

    async function saveExtinguisher() {
        const serial = document.getElementById('serial_number').value;
        if (!serial) return alert("Укажите номер!");

        const payload = {
            shop_name: myDept,
            serial_number: serial,
            type: document.getElementById('ext_type').value,
            charge_weight: document.getElementById('charge_weight').value,
            location: document.getElementById('location').value,
            last_check_date: document.getElementById('last_check').value,
            next_check_date: document.getElementById('next_check').value,
            status: document.getElementById('status').value,
            notes: document.getElementById('notes').value,
            inspector_name: myName // Сохраняем ФИО того, кто нажал кнопку
        };

        const { error } = await _db.from('extinguishers').insert([payload]);
        
        if (error) {
            alert('Ошибка доступа к БД: ' + error.message);
        } else {
            alert('Акт успешно подписан инспектором: ' + myName);
            loadTable();
        }
    }

    async function loadTable() {
        if (!myDept) return;
        
        const { data, error } = await _db
            .from('extinguishers')
            .select('*')
            .eq('shop_name', myDept)
            .order('created_at', { ascending: false });

        if (error) return;

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const now = new Date();

        data.forEach(item => {
            const isOverdue = item.next_check_date && new Date(item.next_check_date) < now;
            tbody.innerHTML += `
                <tr>
                    <td><b>${item.type}</b><br><small>№${item.serial_number}</small></td>
                    <td>${item.location || '—'}</td>
                    <td class="${isOverdue ? 'expired' : ''}">${item.next_check_date || '—'}</td>
                    <td>${item.status}</td>
                    <td><small>${item.inspector_name || '—'}</small></td>
                </tr>
            `;
        });
    }

    loadTable();
</script>
</body>
</html>
