<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Конструктор учета огнетушителей - ССК</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        .header-nav { background: #333; padding: 12px 20px; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .back-btn { background: #555; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .container { max-width: 1000px; margin: 20px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-top: 0; border-bottom: 2px solid #e65100; padding-bottom: 10px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: 600; color: #555; font-size: 13px; }
        input, select, textarea { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        input:disabled { background: #f9f9f9; color: #888; }
        .save-btn { grid-column: span 2; padding: 15px; background: #2e7d32; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; font-size: 13px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #666; text-transform: uppercase; }
        .expired { color: white; background: #d32f2f; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div class="header-nav">
    <a href="index.html" class="back-btn">← Вернуться к списку актов</a>
</div>

<div class="container">
    <h2>🧯 Учет огнетушителей: Конструктор</h2>

    <div class="form-grid">
        <div class="form-group">
            <label>Ваше подразделение (определено автоматически):</label>
            <input type="text" id="shop_name" disabled>
        </div>
        
        <div class="form-group">
            <label>Инвентарный номер (уникальный):</label>
            <input type="text" id="serial_number" placeholder="Например: ССК-ОГ-001">
        </div>
        
        <div class="form-group">
            <label>Тип огнетушителя:</label>
            <select id="ext_type">
                <option value="ОП (порошковый)">ОП (порошковый)</option>
                <option value="ОУ (углекислотный)">ОУ (углекислотный)</option>
                <option value="ОВ (воздушно-пенный)">ОВ (воздушно-пенный)</option>
                <option value="ОХ (химический)">ОХ (химический)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Масса заряда (кг):</label>
            <input type="number" id="charge_weight" step="0.1" placeholder="4.5">
        </div>

        <div class="form-group">
            <label>Дата последней проверки:</label>
            <input type="date" id="last_check" onchange="calcNextCheck()">
        </div>
        
        <div class="form-group">
            <label>Следующая проверка (+3 месяца):</label>
            <input type="date" id="next_check">
        </div>

        <div class="form-group">
            <label>Статус:</label>
            <select id="status">
                <option value="исправен">✅ исправен</option>
                <option value="требуется перезарядка">⚠️ требуется перезарядка</option>
                <option value="списан">❌ списан</option>
            </select>
        </div>

        <div class="form-group">
            <label>Место установки:</label>
            <input type="text" id="location" placeholder="Цех №1, опора 12">
        </div>

        <div class="form-group" style="grid-column: span 2;">
            <label>Примечание:</label>
            <textarea id="notes" rows="2" placeholder="Дополнительная информация..."></textarea>
        </div>

        <button class="save-btn" onclick="saveExtinguisher()">💾 СОХРАНИТЬ ДАННЫЕ</button>
    </div>

    <h3>История записей по цеху</h3>
    <table id="extTable">
        <thead>
            <tr>
                <th>Тип / Номер</th>
                <th>Вес</th>
                <th>Место</th>
                <th>Срок проверки</th>
                <th>Статус</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const _db = supabase.createClient('https://znlizfcqmxgrnhimzgul.supabase.co', 'sb_publishable_RacKEAEQhObo56gGr8BYnA_numHTBIj');

    const rawData = localStorage.getItem('userProfile');
    const userProfile = rawData ? JSON.parse(rawData) : {};
    const myDept = (userProfile.department || "").trim();

    document.getElementById('shop_name').value = myDept || "Цех не определен";

    // Функция автоматического расчета даты (Дата + 3 месяца)
    function calcNextCheck() {
        const lastCheckValue = document.getElementById('last_check').value;
        if (!lastCheckValue) return;

        let date = new Date(lastCheckValue);
        date.setMonth(date.getMonth() + 3); // Прибавляем 3 месяца

        // Форматируем обратно в YYYY-MM-DD для input date
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        
        document.getElementById('next_check').value = `${yyyy}-${mm}-${dd}`;
    }

    async function saveExtinguisher() {
        const serial = document.getElementById('serial_number').value;
        if (!serial) return alert("Введите инвентарный номер!");

        const payload = {
            shop_name: myDept, 
            serial_number: serial,
            type: document.getElementById('ext_type').value,
            charge_weight: document.getElementById('charge_weight').value,
            location: document.getElementById('location').value,
            last_check_date: document.getElementById('last_check').value,
            next_check_date: document.getElementById('next_check').value,
            status: document.getElementById('status').value,
            notes: document.getElementById('notes').value
        };

        const { error } = await _db.from('extinguishers').insert([payload]);
        if (error) alert('Ошибка: ' + error.message);
        else { 
            alert('Огнетушитель ' + serial + ' успешно добавлен!'); 
            loadTable(); 
        }
    }

    async function loadTable() {
        if (!myDept) return;
        const { data, error } = await _db.from('extinguishers').select('*').eq('shop_name', myDept).order('next_check_date', { ascending: true });
        if (error) return;

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const today = new Date();

        data.forEach(item => {
            const isExpired = item.next_check_date ? new Date(item.next_check_date) < today : false;
            tbody.innerHTML += `
                <tr>
                    <td><b>${item.type}</b><br><small>№${item.serial_number}</small></td>
                    <td>${item.charge_weight || '—'} кг</td>
                    <td>${item.location || '—'}</td>
                    <td><span class="${isExpired ? 'expired' : ''}">${item.next_check_date || '—'}</span></td>
                    <td>${item.status}</td>
                </tr>
            `;
        });
    }

    loadTable();
</script>
</body>
</html>
