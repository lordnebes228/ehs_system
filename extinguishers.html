<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Конструктор учета огнетушителей</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        /* Шапка как в админке */
        .header-nav { background: #333; padding: 12px 20px; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .back-btn { background: #555; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .back-btn:hover { background: #777; }
        
        .container { max-width: 1000px; margin: 20px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-top: 0; border-bottom: 2px solid #e65100; padding-bottom: 10px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: 600; color: #555; font-size: 14px; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        input:disabled { background: #f9f9f9; cursor: not-allowed; color: #888; }
        
        .save-btn { grid-column: span 2; padding: 15px; background: #2e7d32; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .save-btn:hover { background: #1b5e20; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #666; font-size: 13px; text-transform: uppercase; }
        .expired { color: #d32f2f; font-weight: bold; background: #ffebee; padding: 2px 5px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="header-nav">
    <a href="index.html" class="back-btn">← Вернуться к списку актов</a>
</div>

<div class="container">
    <h2>🧯 Учет огнетушителей: Конструктор</h2>

    <div class="form-grid">
        <div class="form-group" style="grid-column: span 2;">
            <label>Ваше подразделение (определено автоматически):</label>
            <input type="text" id="shop_name" disabled>
        </div>
        
        <div class="form-group">
            <label>Инвентарный номер:</label>
            <input type="text" id="serial_number" placeholder="Введите номер">
        </div>
        
        <div class="form-group">
            <label>Тип:</label>
            <select id="ext_type">
                <option value="ОП-4">ОП-4 (Порошковый)</option>
                <option value="ОУ-2">ОУ-2 (Углекислотный)</option>
                <option value="ОУ-5">ОУ-5 (Углекислотный)</option>
            </select>
        </div>
        
        <div class="form-group" style="grid-column: span 2;">
            <label>Место установки:</label>
            <input type="text" id="location" placeholder="Где находится огнетушитель?">
        </div>
        
        <div class="form-group">
            <label>Дата проверки:</label>
            <input type="date" id="last_check">
        </div>
        
        <div class="form-group">
            <label>Следующая проверка:</label>
            <input type="date" id="next_check">
        </div>

        <button class="save-btn" onclick="saveExtinguisher()">💾 СОХРАНИТЬ ДАННЫЕ</button>
    </div>

    <h3>История записей по цеху</h3>
    <table id="extTable">
        <thead>
            <tr>
                <th>Тип / Номер</th>
                <th>Место установки</th>
                <th>Срок проверки</th>
                <th>Статус</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    // 1. Используем другое имя переменной, чтобы не было конфликта (Uncaught SyntaxError)
    const _supabaseUrl = 'https://znlizfcqmxgrnhimzgul.supabase.co'; // Твой URL
    const _supabaseKey = 'sb_publishable_RacKEAEQhObo56gGr8BYnA_numHTBIj'; // Твой ключ
    const _db = supabase.createClient(_supabaseUrl, _supabaseKey);

    // 2. Пытаемся достать профиль. 
    // ВАЖНО: Проверь, что при логине ты делаешь localStorage.setItem('userProfile', JSON.stringify(profile))
    const rawData = localStorage.getItem('userProfile');
    const userProfile = rawData ? JSON.parse(rawData) : {};
    
    // Берем департамент и сразу чистим его от лишних пробелов
    const myDept = (userProfile.department || "").trim();

    // Сразу выводим в консоль для отладки (нажми F12 на сайте, чтобы увидеть)
    console.log("Загруженный департамент из профиля:", myDept);

    // Подставляем в поле на экране
    if (myDept) {
        document.getElementById('shop_name').value = myDept;
    } else {
        document.getElementById('shop_name').value = "ОШИБКА: Цех не найден в профиле";
        document.getElementById('shop_name').style.color = "red";
    }

    async function saveExtinguisher() {
        if (!myDept) {
            alert("Невозможно сохранить: ваше подразделение не определено!");
            return;
        }

        const payload = {
            shop_name: myDept, 
            serial_number: document.getElementById('serial_number').value,
            type: document.getElementById('ext_type').value,
            location: document.getElementById('location').value,
            last_check_date: document.getElementById('last_check').value,
            next_check_date: document.getElementById('next_check').value,
            status: 'Годен'
        };

        const { error } = await _db.from('extinguishers').insert([payload]);
        if (error) {
            alert('Ошибка БД: ' + error.message);
        } else { 
            alert('Данные по цеху ' + myDept + ' сохранены!'); 
            loadTable(); 
        }
    }

    async function loadTable() {
        if (!myDept) return;

        const { data, error } = await _db
            .from('extinguishers')
            .select('*')
            .eq('shop_name', myDept) 
            .order('next_check_date', { ascending: true });

        if (error) {
            console.error("Ошибка загрузки таблицы:", error);
            return;
        }

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const today = new Date();

        data.forEach(item => {
            const isExpired = item.next_check_date ? new Date(item.next_check_date) < today : false;
            tbody.innerHTML += `
                <tr>
                    <td><b>${item.type}</b> (№${item.serial_number || '—'})</td>
                    <td>${item.location || '—'}</td>
                    <td class="${isExpired ? 'expired' : ''}">${item.next_check_date || '—'}</td>
                    <td>${item.status || '—'}</td>
                </tr>
            `;
        });
    }

    // Запускаем загрузку таблицы при открытии страницы
    loadTable();
</script>
</body>
</html>
